# =============================================================================
# QSM Pipeline — конфигурация (ПРИМЕР)
# =============================================================================
# ⚠️ Это шаблон! Скопируйте его в config.yaml и подставьте свои пути:
#     cp config.example.yaml config.yaml
#
# ВАЖНО: data_dir и output_dir задаются через CLI в qsm.py:
#   python qsm.py --data-dir /путь/к/data --output-dir /путь/к/output
#
# Этот файл содержит только параметры обработки.
# =============================================================================

# =============================================================================
# INPUT — источник маски мозга
# =============================================================================
input:
  # Источник маски мозга:
  #   fsl    — FSL BET (быстро, стабильно)
  #   hdbet  — HD-BET (нейросеть, медленно, точнее)
  #   otsu   — Otsu threshold (чистый Python)
  #   auto   — пытается FSL BET → fallback на Otsu
  mask_source: 'fsl'

  # Параметры FSL BET
  bet_f: 0.7           # 0.4 (мягче) .. 0.7 (строже)
  bet_robust: true     # флаг -R

  # Опционально: готовая маска
  # mask_path: '/path/to/brain_mask.nii.gz'

# =============================================================================
# PREPROCESSING — переименование файлов
# =============================================================================
preprocessing:
  rename_files: true

  # Подстрока для выбора серии, если в папке несколько наборов.
  # Например, '701' — только серия 701 (DASHIN).
  # series_filter: null

  # Пробный запуск — показать план переименования, файлы не трогать
  dry_run: false

# =============================================================================
# ACQUISITION — параметры сканирования
# =============================================================================
acquisition:
  B0: 3.0              # Напряжённость поля (Тесла)

  # TE можно указать вручную, но обычно берётся из JSON sidecar.
  # Пустой список → TE читаются из echo-*_part-mag.json
  # TE: [0.005637, 0.011996, 0.018355, 0.024713, 0.031072, 0.037431, 0.043789]

  # Voxel size (мм). Если не указан — берётся из NIfTI header.
  # voxel_size: [0.446, 0.446, 0.500]

# =============================================================================
# PHASE UNWRAPPING — развёртка фазы
# =============================================================================
phase_unwrapping:
  # Метод развёртки:
  #   laplacian  — Laplacian-based (Schofield 2003), чистый Python (рекомендуется)
  #   romeo      — ROMEO.jl (требует Julia + romeo.jl)
  #   prelude    — FSL PRELUDE (может давать кольца при большом TE)
  #   herraez    — skimage.unwrap_phase (медленно, менее точный)
  #   none       — без развёртки
  method: "laplacian"

# =============================================================================
# BACKGROUND REMOVAL — удаление фонового поля
# =============================================================================
background_removal:
  enabled: true

  # Метод удаления фона:
  #   resharp  — Regularization Enabled SHARP (рекомендуется)
  #   pdf      — Projection onto Dipole Fields
  #   none     — без удаления
  method: "resharp"

  # Параметры RESHARP
  resharp:
    lambda_reg: 0.01     # параметр Тихоновской регуляризации
    radius_mm: 4.0       # радиус SMV-ядра (мм). 3-5 для мозга
    erode_iter: 0        # эрозия маски (0 = без эрозии)
    verbose: true

  # Параметры PDF (используется, если method: "pdf")
  pdf:
    tol: 0.0001          # критерий сходимости
    max_iter: 200        # максимум итераций
    erode_iter: 3        # эрозия маски
    reg: 0.05            # Тихоновская регуляризация
    alpha: 0.5           # коэффициент демпфирования (0..1)
    verbose: true

# =============================================================================
# DIPOLE INVERSION — дипольная инверсия
# =============================================================================
dipole_inversion:
  # Метод инверсии:
  #   tikhonov  — Tikhonov regularization (рекомендуется)
  #   tkd       — Truncated K-space Division (острее, шумнее)
  method: "tikhonov"

  # Предварительное Гауссово сглаживание local_field (в вокселях).
  # 0 = без сглаживания, 0.5-1.0 = компромисс, >2.0 = слишком гладко.
  smooth_sigma: 0.5

  # Параметры TKD
  tkd:
    threshold: 0.15      # порог обрезки ядра (0.05 остро .. 0.20 гладко)

  # Параметры Tikhonov
  tikhonov:
    lambda: 0.05         # регуляризация (0.02 резко .. 0.15 гладко)

# =============================================================================
# PROCESSING — стратегия обработки эхо
# =============================================================================
processing:
  # combined  — взвешенное по TE среднее всех эхо
  # single    — одно эхо (см. single_echo_index)
  echo_strategy: "combined"

  # Индекс эхо для single (0 = первое, N-1 = последнее)
  single_echo_index: 0

# =============================================================================
# NEUROMELANIN — параметры NM-анализа (используется в neuromelanin/run.py)
# =============================================================================
# Все пути для NM-анализа задаются через CLI:
#   python neuromelanin/run.py \
#       --data-dir /путь/к/data/nifti \
#       --dicom-dir /путь/к/data/dicom \
#       --output-dir /путь/к/output \
#       --kcl-dir /путь/к/KCL \
#       --syn
#
# Ниже — только параметры, которые можно переопределить:
# neuromelanin:
#   enabled: true
#   nm_sequence: "auto"        # auto | tse | mtc_gre | gre
#   erode_sn: 3                # радиус эрозии маски SN
#   auto_sn_shift: true        # автокалибровка сдвига
#   sn_shift_range: "0,30,2"   # start,stop,step
